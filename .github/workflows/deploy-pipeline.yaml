name: CI/CD Pipeline - Dev -> Staging -> Production (Vercel)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-to-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-test-dev:
    name: "1. Build & Test (Dev)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci; then
            echo "::warning::package-lock.json is out of sync with package.json. Regenerating it for this run."
            npm install --package-lock-only
            npm ci
          fi

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  security-scan-dev:
    name: "2. Security Scan (Dev)"
    runs-on: ubuntu-latest
    needs: build-test-dev
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci; then
            echo "::warning::package-lock.json is out of sync with package.json. Regenerating it for this run."
            npm install --package-lock-only
            npm ci
          fi

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Snyk dependency scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  deploy-dev:
    name: "3. Deploy to Dev"
    runs-on: ubuntu-latest
    needs: security-scan-dev
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN_DEV }}

      - run: vercel build --token=${{ secrets.VERCEL_TOKEN_DEV }}

      - name: Deploy to Vercel Dev
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN_DEV }})"
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.deployment-url }}" > /dev/null

  build-test-staging:
    name: "4. Build & Test (Staging)"
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci; then
            echo "::warning::package-lock.json is out of sync with package.json. Regenerating it for this run."
            npm install --package-lock-only
            npm ci
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy-staging:
    name: "5. Deploy to Staging"
    runs-on: ubuntu-latest
    needs: build-test-staging
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN_STAGE }}

      - run: vercel build --token=${{ secrets.VERCEL_TOKEN_STAGE }}

      - name: Deploy to Vercel Staging
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN_STAGE }})"
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.deployment-url }}" > /dev/null

  production-gate:
    name: "6. Approve Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production-gate
    steps:
      - run: echo "Production deployment approved."

  deploy-production:
    name: "7. Deploy to Production"
    runs-on: ubuntu-latest
    needs: production-gate
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN_PROD }}

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN_PROD }}

      - name: Deploy to Vercel Production
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_PROD }})"
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.deployment-url }}" > /dev/null
