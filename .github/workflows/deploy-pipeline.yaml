name: CI/CD Pipeline - Dev -> Staging -> Production (Vercel)

# ============================================================================
# PIPELINE OVERVIEW
# ============================================================================
# 1. build-and-test     -> lint, unit tests, build artifact
# 2. security-scan       -> SAST, dependency audit, secret scanning
# 3. deploy-dev           -> auto-deploy to Dev environment on Vercel
# 4. assess-dev           -> MANUAL approval gate (QA/dev review)
# 5. deploy-staging       -> auto-deploy to Staging (after dev approval)
# 6. assess-staging       -> MANUAL approval gate (QA/stakeholder review)
# 7. deploy-production    -> deploy to Production (after staging approval)
#
# Manual gates are implemented using GitHub "Environments" with required
# reviewers configured in repo Settings -> Environments -> (dev/staging/prod).
# ============================================================================

on:
  push:
    branches:
      - develop     # triggers dev pipeline
      - main        # triggers full pipeline toward production
  pull_request:
    branches:
      - develop
      - main

env:
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

  # ==========================================================================
  # STAGE 1: BUILD AND TEST
  # ==========================================================================
  build-and-test:
    name: "1. Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  # ==========================================================================
  # STAGE 2: SECURITY SCANNING (full pass)
  # ==========================================================================
  security-scan:
    name: "2. Security Scan"
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # --- Dependency / supply-chain vulnerability scan ---
      - name: npm audit (dependency vulnerabilities)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Snyk dependency & license scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # --- Static Application Security Testing (SAST) ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # --- Secret scanning ---
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # --- Infrastructure-as-code / config scan (if applicable) ---
      - name: Trivy config & filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            trivy-results.*
            gitleaks-report.*

  # ==========================================================================
  # STAGE 3: DEPLOY TO DEV
  # ==========================================================================
  deploy-dev:
    name: "3. Deploy to Dev"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (dev)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN_DEV }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN_DEV }}

      - name: Deploy to Vercel (Dev)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN_DEV }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test
        run: |
          curl -sSf ${{ steps.deploy.outputs.deployment-url }} > /dev/null

  # ==========================================================================
  # STAGE 4: MANUAL ASSESSMENT - DEV
  # ==========================================================================
  # Configure this environment in GitHub: Settings > Environments > dev-approval
  # Add required reviewers (e.g. QA lead, dev lead) so the pipeline pauses here
  # until someone manually approves the run in the Actions tab.
  assess-dev:
    name: "4. Manual Review - Dev"
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: dev-approval
    steps:
      - name: Assessment checkpoint
        run: |
          echo "Dev deployment approved. Proceeding to staging."
          echo "Checklist reviewers should confirm before approving:"
          echo " - Feature works as expected in Dev"
          echo " - No console/runtime errors"
          echo " - Security scan results reviewed (Stage 2 artifacts)"
          echo " - No regressions vs previous Dev build"

  # ==========================================================================
  # STAGE 5: DEPLOY TO STAGING
  # ==========================================================================
  deploy-staging:
    name: "5. Deploy to Staging"
    runs-on: ubuntu-latest
    needs: assess-dev
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (staging)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN_STAGE }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN_STAGE }}

      - name: Deploy to Vercel (Staging)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN_STAGE }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Run integration / end-to-end tests
        run: npm run test:e2e -- --baseUrl=${{ steps.deploy.outputs.deployment-url }}

      - name: Run OWASP ZAP baseline scan (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.deploy.outputs.deployment-url }}
          cmd_options: "-a"

  # ==========================================================================
  # STAGE 6: MANUAL ASSESSMENT - STAGING
  # ==========================================================================
  # Configure this environment in GitHub: Settings > Environments > staging-approval
  # Recommend requiring 2 reviewers here (e.g. QA + product/security owner)
  # since this is the last gate before production.
  assess-staging:
    name: "6. Manual Review - Staging"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: staging-approval
    steps:
      - name: Assessment checkpoint
        run: |
          echo "Staging deployment approved. Proceeding to production."
          echo "Checklist reviewers should confirm before approving:"
          echo " - Full regression / E2E tests passed"
          echo " - DAST scan (OWASP ZAP) reviewed, no unresolved high findings"
          echo " - Performance acceptable under staging load"
          echo " - Stakeholder / product sign-off obtained"

  # ==========================================================================
  # STAGE 7: DEPLOY TO PRODUCTION
  # ==========================================================================
  deploy-production:
    name: "7. Deploy to Production"
    runs-on: ubuntu-latest
    needs: assess-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN_PROD }}

      - name: Build project artifacts (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN_PROD }}

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_PROD }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test
        run: |
          curl -sSf ${{ steps.deploy.outputs.deployment-url }} > /dev/null

      - name: Notify team of production release
        run: |
          echo "Production deployment complete: ${{ steps.deploy.outputs.deployment-url }}"
          # Wire this into Slack/Teams webhook if desired