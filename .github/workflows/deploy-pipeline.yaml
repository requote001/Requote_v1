name: CI/CD Pipeline - Dev -> Staging -> Production (Vercel)

# ============================================================================
# PIPELINE FLOW (per your request)
# ============================================================================
# PUSH TO DEV BRANCH triggers automatically:
#   1. build-test-dev      -> lint, unit tests, build
#   2. security-scan-dev   -> SAST, dependency audit, secret scanning
#   3. deploy-dev          -> auto-deploy to Vercel Dev
#
# --- HARD STOP: nothing proceeds to staging until a human approves ---
#
#   4. staging-gate        -> MANUAL approval required to even start staging
#
# ONCE APPROVED, staging runs its OWN full validation (not just a redeploy):
#   5. build-test-staging  -> lint, unit tests, build (fresh pass, for staging)
#   6. security-scan-staging -> SAST, dependency audit, secret scanning
#   7. deploy-staging      -> auto-deploy to Vercel Staging
#
# --- HARD STOP: nothing proceeds to production until a human approves ---
#
#   8. production-gate     -> MANUAL approval required before production
#   9. deploy-production   -> deploy to Vercel Production
#
# Manual gates use GitHub "Environments" with required reviewers configured
# in repo Settings -> Environments -> (staging-gate / production-gate).
# Nobody can skip a gate by re-running a job; the workflow run itself
# pauses and waits in the Actions tab until a reviewer clicks Approve.
# ============================================================================

on:
  push:
    branches:
      - develop   # ONLY dev push auto-starts the pipeline
  workflow_dispatch: {} # allows manually re-running/retriggering if needed

env:
  NODE_VERSION: "22"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

  # ==========================================================================
  # DEV STAGE 1: BUILD AND TEST
  # ==========================================================================
  build-test-dev:
    name: "1. Build & Test (Dev)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || {
            echo "::warning::package-lock.json is out of sync with package.json — falling back to 'npm install'."
            npm install
          }

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build-output-dev
          path: dist/

  # ==========================================================================
  # DEV STAGE 2: SECURITY SCAN
  # ==========================================================================
  security-scan-dev:
    name: "2. Security Scan (Dev)"
    runs-on: ubuntu-latest
    needs: build-test-dev
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci || {
            echo "::warning::package-lock.json is out of sync with package.json — falling back to 'npm install'."
            npm install
          }

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Snyk dependency & license scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Trivy config & filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  # ==========================================================================
  # DEV STAGE 3: DEPLOY TO DEV (automatic, no gate before this)
  # ==========================================================================
  deploy-dev:
    name: "3. Deploy to Dev"
    runs-on: ubuntu-latest
    needs: security-scan-dev
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN_DEV }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN_DEV }}

      - name: Deploy to Vercel (Dev)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN_DEV }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: curl -sSf ${{ steps.deploy.outputs.deployment-url }} > /dev/null

  # ==========================================================================
  # HARD STOP: nothing proceeds to staging without manual approval
  # ==========================================================================
  # Configure in GitHub: Settings > Environments > staging-gate
  # Add required reviewers there. The workflow pauses here in the Actions
  # tab until someone clicks Approve — staging build/test/deploy does not
  # start until that happens.
  staging-gate:
    name: "4. MANUAL GATE - Approve start of Staging"
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: staging-gate
    steps:
      - name: Gate checkpoint
        run: |
          echo "Approved to begin staging build, test, and deploy."
          echo "Reviewers should confirm before approving:"
          echo " - Dev deployment reviewed and working"
          echo " - No unresolved issues from dev's security scan"

  # ==========================================================================
  # STAGING STAGE 1: BUILD AND TEST (fresh pass, only runs after the gate)
  # ==========================================================================
  build-test-staging:
    name: "5. Build & Test (Staging)"
    runs-on: ubuntu-latest
    needs: staging-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || {
            echo "::warning::package-lock.json is out of sync with package.json — falling back to 'npm install'."
            npm install
          }

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build-output-staging
          path: dist/

  # ==========================================================================
  # STAGING STAGE 2: SECURITY SCAN
  # ==========================================================================
  security-scan-staging:
    name: "6. Security Scan (Staging)"
    runs-on: ubuntu-latest
    needs: build-test-staging
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci || {
            echo "::warning::package-lock.json is out of sync with package.json — falling back to 'npm install'."
            npm install
          }

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Snyk dependency & license scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Trivy config & filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  # ==========================================================================
  # STAGING STAGE 3: DEPLOY TO STAGING (automatic, once gate is passed)
  # ==========================================================================
  deploy-staging:
    name: "7. Deploy to Staging"
    runs-on: ubuntu-latest
    needs: security-scan-staging
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN_STAGE }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN_STAGE }}

      - name: Deploy to Vercel (Staging)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN_STAGE }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Integration / E2E tests
        run: npm run test:e2e -- --baseUrl=${{ steps.deploy.outputs.deployment-url }}

      - name: OWASP ZAP baseline scan (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.deploy.outputs.deployment-url }}
          cmd_options: "-a"

  # ==========================================================================
  # HARD STOP: nothing proceeds to production without manual approval
  # ==========================================================================
  # Configure in GitHub: Settings > Environments > production-gate
  # Recommend requiring 2 reviewers here since this is the last stop before
  # production traffic.
  production-gate:
    name: "8. MANUAL GATE - Approve Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production-gate
    steps:
      - name: Gate checkpoint
        run: |
          echo "Approved for production deployment."
          echo "Reviewers should confirm before approving:"
          echo " - Staging deployment reviewed and working"
          echo " - E2E tests and DAST scan reviewed, no unresolved high findings"
          echo " - Stakeholder / product sign-off obtained"

  # ==========================================================================
  # STAGE 9: DEPLOY TO PRODUCTION (only after production-gate is approved)
  # ==========================================================================
  deploy-production:
    name: "9. Deploy to Production"
    runs-on: ubuntu-latest
    needs: production-gate
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN_PROD }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN_PROD }}

      - name: Deploy to Vercel (Production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_PROD }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: curl -sSf ${{ steps.deploy.outputs.deployment-url }} > /dev/null

      - name: Notify team
        run: |
          echo "Production deployment complete: ${{ steps.deploy.outputs.deployment-url }}"