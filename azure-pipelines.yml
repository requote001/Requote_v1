# Next.js CI/CD Pipeline — requote-project-v1
# Build, Lint, Test, and Publish artifacts for a Next.js project
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'

stages:

# ---------------------------------------------------
# STAGE 1: BUILD
# ---------------------------------------------------
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: Build
    displayName: 'Install, Lint & Build'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'Install dependencies (npm install)'

    - script: |
        npm run lint
      displayName: 'Run ESLint'

    - script: |
        npm run build
      displayName: 'Build Next.js project'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)'
        artifact: 'drop'
        publishLocation: 'pipeline'
      displayName: 'Publish full build output as artifact'

# ---------------------------------------------------
# STAGE 2: TEST
# ---------------------------------------------------
- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  jobs:
  - job: Test
    displayName: 'Run Unit & Coverage Tests'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'Install dependencies'

    - script: |
        npm test
      displayName: 'Run Vitest'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results/*.xml'
        mergeTestResults: true
        failTaskOnFailedTests: true
      displayName: 'Publish test results'
      condition: succeededOrFailed()

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
      displayName: 'Publish code coverage'
      condition: succeededOrFailed()

# ---------------------------------------------------
# STAGE 3: PUBLISH RELEASE ARTIFACT
# ---------------------------------------------------
- stage: PublishArtifact
  displayName: 'Publish Release Artifact'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: Package
    displayName: 'Package & Publish'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        npm install
        npm run build
      displayName: 'Rebuild for packaging'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app-$(Build.BuildId).zip'
        replaceExistingArchive: true
      displayName: 'Archive build output (.next, public, package.json, etc.)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'release'
        publishLocation: 'Container'
      displayName: 'Publish zipped release artifact'

# ---------------------------------------------------
# STAGE 4: DEPLOY (placeholder)
# ---------------------------------------------------
- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: PublishArtifact
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Environment'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo "Add your deployment steps here (Vercel, Azure Web App, etc.)"
            displayName: 'Deploy placeholder'